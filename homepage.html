<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prim Barber</title>

    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-zinc-300 text-stone-950 antialiased font-['Jost']">

<section class="relative flex flex-col md:flex-row items-center justify-center text-center h-screen bg-zinc-300 overflow-hidden">

    <!-- Background Text -->
    <h1 class="absolute text-[16vw] md:text-[10vw] font-extrabold text-stone-950/10 select-none pointer-events-none left-10 top-1/3 -translate-y-1/2 tracking-widest">
        FRESH
    </h1>
    <h1 class="absolute text-[16vw] md:text-[10vw] font-extrabold text-stone-950/10 select-none pointer-events-none right-64 top-2/3 -translate-y-1/2 tracking-widest">
        CUT
    </h1>

    <!-- Center Line -->
    <div class="absolute top-1/2 left-0 w-full h-[2px] bg-stone-950/40 -translate-y-1/2"></div>

    <!-- Image Block -->
    <div class="relative bg-stone-950 w-full md:max-w-lg order-1 h-screen md:h-auto z-10">
        <img
                src="assets/PHOTO%20LOGO.png"
                alt="Barber shop interior"
                class="w-full h-full object-cover"
        >
        <div class="absolute inset-0 flex flex-col justify-center items-center p-8">
            <img src="assets/logo-light.svg" alt="Prim Barber Logo" class="w-full max-w-sm mb-4">
        </div>

        <button
                onclick="openReservation()"
                class="absolute bottom-6 left-1/2 -translate-x-1/2 w-3/4 max-w-64
             bg-transparent text-white border-2 border-white px-8 py-3 font-semibold text-lg uppercase tracking-wider
             transition-all duration-300 hover:bg-white/50 bg-white/25">
            BOOK NOW
        </button>
    </div>
</section>


<!-- About Us Section -->
<section class="py-4  flex flex-col md:flex-row md:items-center
                bg-gradient-to-r from-zinc-400 to-zinc-300 my-10 h-96 md:h-96 md:px-0 px-6">

    <!-- Rotated Title Wrapper -->
    <div class="md:-rotate-90 md:flex-shrink-0 mb-6 md:mb-0">
        <h2 class="text-4xl font-extrabold md:text-5xl md:whitespace-nowrap text-stone-950 tracking-widest">
        ABOUT&nbsp;US
        </h2>
    <!-- Line Div -->
        <div class="h-0.5 bg-stone-950 shadow-[0_2px_4px_0_rgba(250,204,21,0.6)] mt-1"></div>
    </div>

    <div class="space-y-12 text-xl  font-medium text-stone-950/90 flex-1">
        <p class="border-l-2 border-stone-950 pl-4">1000+ Haircuts completed with precision</p>
        <p class="border-l-2 border-stone-950 pl-4">Modern & classic styles perfected</p>
        <p class="border-l-2 border-stone-950 pl-4">5+ years of experience in the craft</p>
    </div>

</section>

<!-- Gallery Section -->
<section class="py-10 px-6 md:px-16 my-10 flex flex-col">

    <!-- Title Wrapper -->
    <div class="inline-block mb-8 self-end">
        <h2 class="text-4xl font-extrabold md:text-5xl text-stone-950 tracking-widest">
            GALLERY
        </h2>
        <!-- Line Div -->
        <div class="h-0.5 bg-stone-950 shadow-[0_2px_4px_0_rgba(250,204,21,0.6)] mt-1"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 w-full">

        <!-- Image 1 (Tall Portrait, spans 2 rows on md) -->
        <img src="https://placehold.co/600x900" alt="Barber work sample" class="md:row-span-2 object-cover w-full h-full hover:scale-[1.02] transition-transform duration-300">

        <!-- Image 2 (Landscape) -->
        <img src="https://placehold.co/600x450" alt="Barber work sample" class="object-cover w-full h-auto aspect-[4/3] hover:scale-[1.02] transition-transform duration-300">

        <!-- Image 3 (Landscape) -->
        <img src="https://placehold.co/600x450" alt="Barber work sample" class="object-cover w-full h-auto aspect-[4/3] hover:scale-[1.02] transition-transform duration-300">

        <!-- Image 4 (Portrait) -->
        <img src="https://placehold.co/600x800" alt="Barber work sample" class="object-cover w-full h-auto aspect-[3/4] hover:scale-[1.02] transition-transform duration-300">

        <!-- Image 5 (Landscape) -->
        <img src="https://placehold.co/800x600" alt="Barber work sample" class="object-cover w-full h-auto aspect-[4/3] hover:scale-[1.02] transition-transform duration-300">
    </div>
</section>

<!-- Contact / Map Section -->
<section class="bg-stone-950 text-white py-12 px-6 md:px-16 flex flex-col items-center">

    <!-- Title -->
    <h2 class="text-4xl font-extrabold md:text-5xl text-zinc-300 tracking-widest mb-10">
        CONTACT
    </h2>

    <!-- Logo -->
    <img src="assets/logo-light.svg" alt="Prim Barber Logo" class="w-1/2 md:w-1/4 mb-10">

    <!-- Info & Map -->
    <div class="flex flex-col md:flex-row w-full md:gap-12 items-center md:items-center space-y-10 md:space-y-0">

        <!-- Info Block -->
        <div class="md:w-1/2 w-full flex flex-col md:flex-row justify-center md:justify-between items-center md:items-center text-center md:text-left gap-6">

            <!-- Contact Info -->
            <div class="flex flex-col items-center md:items-start space-y-2">
                <a href="tel:+421903444666"
                   class="text-zinc-300 hover:text-white font-medium text-xl transition-colors duration-300">
                    +421 903 444 666
                </a>

                <a href="https://www.instagram.com/primbarbershop_vrable/" target="_blank" rel="noopener noreferrer"
                   class="flex items-center justify-center md:justify-start gap-2 text-zinc-300 hover:text-white transition-colors duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         class="w-6 h-6">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                    <p class="font-semibold text-xl">primbarber</p>
                </a>
            </div>

            <!-- Address -->
            <div class="flex flex-col items-center md:items-start text-zinc-300">
                <p class="font-semibold text-xl mb-1">Address</p>
                <p class="text-lg leading-snug">Krátka 168<br>952 01 Vráble, Slovakia</p>
            </div>
        </div>

        <!-- Map Block -->
        <div class="relative w-full md:w-2/3 h-64 md:h-96 cursor-pointer rounded-2xl overflow-hidden shadow-lg"
             onclick="openNavigation(48.2427419,18.3038643)">
            <img src="assets/map.png" alt="Prim Barber Location" class="w-full h-full object-cover">
        </div>

    </div>


</section>


<script>

    function openNavigation(lat, lng) {
        const isApple = /iPad|iPhone|Macintosh/.test(navigator.userAgent);
        const navURL = isApple
            ? `http://maps.apple.com/?daddr=${lat},${lng}`
            : `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
        window.open(navURL, "_blank");
    }

    function openReservation() {
        // 🧾 Replace this link with your actual booking page URL
        const reservationURL = "https://your-reservation-system.com";
        window.open(reservationURL, "_blank");
    }
</script>


</body>
</html>
